name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test without GPU tuning
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Test
      - name: Package release files and SHA-256 manifest
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Radeoner-Windows-x64
          path: |
            artifacts/releases/*/*.zip
            artifacts/releases/*/update.json
            artifacts/releases/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
